<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; margin: 0; padding: 16px; font-family: system-ui, sans-serif;
           background: #0f1a14; color: #f3efe0; text-align: center; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 999px; cursor: pointer;
             font-size: 15px; font-weight: 700; }
    button.on  { background: #d4af37; color: #0f1a14; }
    button.off { background: #444; color: #ddd; }
    p { margin: 10px 0 0; font-size: 12px; opacity: .7; }
  </style>
</head>
<body>
  <h2>Shorts Blocker</h2>
  <button id="toggle"></button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
